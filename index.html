<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>
body {
    background: #030303;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.box {
    background: #111;
    padding: 30px;
    border-radius: 15px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    border: none;
    font-weight: bold;
    cursor: pointer;
    border-radius: 10px;
}

.on { background: green; color: white; }
.off { background: red; color: white; }
</style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Enter Password"><br><br>
    <button onclick="login()">Login</button>
</div>

<div class="box" id="panel" style="display:none;">
    <h2>Status Control</h2>
    <button class="on" onclick="setOnline()">GO ONLINE</button>
    <button class="off" onclick="setOffline()">GO OFFLINE</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBxCJJLsZQtlwPyW3gWvl2dO25-eSpOYEg",
  databaseURL: "https://ff-tournament-app-abcf0-default-rtdb.firebaseio.com",
  projectId: "ff-tournament-app-abcf0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function login() {
    const pass = document.getElementById("pass").value;
    if (pass === "985623147") {
        document.getElementById("loginBox").style.display = "none";
        document.getElementById("panel").style.display = "block";
    } else {
        alert("Wrong password");
    }
}

function setOnline() {
    db.ref("status").set("online");
}

function setOffline() {
    db.ref("status").set("offline");
}
</script>

</body>
</html>
