<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Admin — Diyan Sharma</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>

*{ box-sizing:border-box; }

html,body{
    margin:0;
    padding:0;
    background:#030303;
    font-family:'Outfit',sans-serif;
    color:white;
    min-height:100vh;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    transition:0.5s ease;
    overflow-x:hidden;
    position:relative;
}

/* ambient glow background, follows status */
body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    transition:0.6s ease;
    background:radial-gradient(circle at 50% 20%, rgba(0,255,102,0.10), transparent 60%);
}

body.offline::before{
    background:radial-gradient(circle at 50% 20%, rgba(255,59,59,0.10), transparent 60%);
}

/* PANEL */
.container{
    width:100%;
    max-width:420px;
    z-index:2;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    padding:34px 28px;
    border-radius:26px;
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
    text-align:center;
}

/* MOBILE */
@media (max-width:480px){
    body{ padding:14px; align-items:flex-start; padding-top:8vh; }
    .card{ padding:28px 20px; border-radius:22px; }
    .title{ font-size:18px; }
    .status-ring{ width:96px; height:96px; }
    .status-ring .core{ width:68px; height:68px; font-size:22px; }
    .status-word{ font-size:20px; }
    .switch{ width:80px; height:42px; }
    .switch .knob{ width:34px; height:34px; }
    .switch.on .knob{ left:41px; }
    .switch-label{ font-size:12px; width:52px; }
    .hint{ font-size:12px; }
}

@media (max-width:360px){
    .switch-row{ gap:10px; }
    .switch-label{ width:44px; }
}

.eyebrow{
    font-size:12px;
    letter-spacing:3px;
    color:#777;
    font-weight:700;
    text-transform:uppercase;
}

.title{
    font-size:20px;
    font-weight:800;
    margin-top:6px;
}

/* CURRENT STATUS DISPLAY */
.status-display{
    margin:32px 0 26px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
}

.status-ring{
    width:110px;
    height:110px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    transition:0.5s ease;
}

.status-ring .core{
    width:78px;
    height:78px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    transition:0.5s ease;
}

.status-ring.online{
    border:3px solid #00ff66;
    box-shadow:0 0 30px rgba(0,255,102,0.5);
}
.status-ring.online .core{
    background:rgba(0,255,102,0.12);
    color:#00ff66;
}

.status-ring.offline{
    border:3px solid #ff3b3b;
    box-shadow:0 0 30px rgba(255,59,59,0.4);
}
.status-ring.offline .core{
    background:rgba(255,59,59,0.12);
    color:#ff3b3b;
}

.status-ring.pending{
    border:3px solid #555;
}
.status-ring.pending .core{
    background:rgba(255,255,255,0.05);
    color:#666;
}

.status-word{
    font-size:22px;
    font-weight:800;
    letter-spacing:1px;
}

.status-word.online{ color:#00ff66; }
.status-word.offline{ color:#ff3b3b; }
.status-word.pending{ color:#666; }

.status-sub{
    font-size:12px;
    color:#777;
}

/* TOGGLE SWITCH */
.switch-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    margin-top:10px;
}

.switch-label{
    font-size:13px;
    font-weight:700;
    color:#888;
    width:60px;
}

.switch-label.left{ text-align:right; }
.switch-label.right{ text-align:left; }

.switch{
    width:74px;
    height:38px;
    border-radius:50px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    position:relative;
    cursor:pointer;
    transition:0.35s ease;
    flex-shrink:0;
}

.switch .knob{
    position:absolute;
    top:3px;
    left:3px;
    width:30px;
    height:30px;
    border-radius:50%;
    background:#ff3b3b;
    box-shadow:0 0 12px rgba(255,59,59,0.6);
    transition:0.35s cubic-bezier(.5,-0.2,.3,1.5);
    display:flex;
    align-items:center;
    justify-content:center;
    color:black;
    font-size:12px;
}

.switch.on{
    background:rgba(0,255,102,0.12);
    border-color:rgba(0,255,102,0.4);
}

.switch.on .knob{
    left:37px;
    background:#00ff66;
    box-shadow:0 0 12px rgba(0,255,102,0.7);
}

.switch.disabled{
    opacity:0.5;
    pointer-events:none;
}

.hint{
    margin-top:22px;
    font-size:12px;
    color:#666;
    line-height:1.6;
}

.back-link{
    display:inline-block;
    margin-top:20px;
    font-size:12px;
    color:#888;
    text-decoration:none;
    border:1px solid rgba(255,255,255,0.12);
    padding:8px 16px;
    border-radius:50px;
    transition:0.3s;
}

.back-link:hover{
    color:white;
    border-color:rgba(255,255,255,0.3);
}

.toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:#111;
    border:1px solid rgba(255,255,255,0.15);
    padding:10px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    font-size:13px;
    z-index:999;
}

.toast.show{ opacity:1; }

</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<div class="container">
    <div class="card">
        <div class="eyebrow">Status Admin</div>
        <div class="title">Diyan Sharma — Presence Control</div>

        <div class="status-display">
            <div class="status-ring pending" id="ring">
                <div class="core"><i class="fa-solid fa-circle-question"></i></div>
            </div>
            <div class="status-word pending" id="word">CHECKING…</div>
            <div class="status-sub" id="sub">Connecting to database</div>
        </div>

        <div class="switch-row">
            <span class="switch-label left">OFFLINE</span>
            <div class="switch disabled" id="switch" onclick="handleToggle()">
                <div class="knob"><i class="fa-solid fa-power-off"></i></div>
            </div>
            <span class="switch-label right">ONLINE</span>
        </div>

        <div class="hint">Tap the switch to set your live status.<br>This updates instantly on your profile page.</div>

        <a class="back-link" href="https://diyankobio.vercel.app" target="_blank" rel="noopener"><i class="fa-solid fa-arrow-left"></i>&nbsp; Back to profile</a>
    </div>
</div>

<script>
/* FIREBASE */
const firebaseConfig = {
    apiKey: "AIzaSyBxCJJLsZQtlwPyWgvl2dO25-eSpOYEg", // ⚠️ verify this in your Firebase console — real keys are 39 characters
    authDomain: "ff-tournament-app-abcf0.firebaseapp.com",
    databaseURL: "https://ff-tournament-app-abcf0-default-rtdb.firebaseio.com",
    projectId: "ff-tournament-app-abcf0"
};

const ring = document.getElementById("ring");
const word = document.getElementById("word");
const sub = document.getElementById("sub");
const switchEl = document.getElementById("switch");
const toast = document.getElementById("toast");

let currentStatus = null;
let statusRef = null;

function showToast(msg){
    toast.innerText = msg;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 1800);
}

function render(status){
    currentStatus = status;
    const isOnline = status === "online";
    document.body.classList.toggle("offline", !isOnline);

    ring.className = "status-ring " + status;
    ring.querySelector(".core").innerHTML = isOnline
        ? '<i class="fa-solid fa-bolt"></i>'
        : '<i class="fa-solid fa-moon"></i>';

    word.className = "status-word " + status;
    word.innerText = isOnline ? "ONLINE" : "OFFLINE";
    sub.innerText = isOnline ? "Visible as active on your profile" : "Showing as offline on your profile";

    switchEl.classList.toggle("on", isOnline);
    switchEl.classList.remove("disabled");
}

try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    statusRef = db.ref("status");

    statusRef.on("value", snap => {
        const val = snap.val() || "offline";
        render(val);
    }, err => {
        console.error("Firebase read error:", err);
        word.innerText = "CONNECTION ERROR";
        sub.innerText = "Could not reach the database";
    });
} catch(err) {
    console.error("Firebase init error:", err);
    word.innerText = "CONNECTION ERROR";
    sub.innerText = "Could not reach the database";
}

function handleToggle(){
    if (!statusRef || currentStatus === null) return;
    const next = currentStatus === "online" ? "offline" : "online";
    switchEl.classList.add("disabled");
    statusRef.set(next)
        .then(() => showToast(next === "online" ? "You're now ONLINE" : "You're now OFFLINE"))
        .catch(err => {
            console.error("Failed to update status:", err);
            showToast("Failed to update — try again");
            switchEl.classList.remove("disabled");
        });
}
</script>
</body>
    </html>
